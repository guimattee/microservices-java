spring.application.name=currency-service
server.port=8100

spring.datasource.url=jdbc:postgresql://localhost/db_currency
spring.datasource.username=postgres
spring.datasource.password=190207Gui

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.locations=classpath:db_migration

eureka.client.service-url.default-zone=http://localhost:8761/eureka

eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always
#exibe informacoes do endpoint no actuator
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Servico para conversao de moedas utilizando a API do BCB
info.app.autor=Guilherme Matte Embarach

#personalizacao do endpoint /actuator/info
eureka.instance.metadata-map.github.repo=guimattee/microservices-java

management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
